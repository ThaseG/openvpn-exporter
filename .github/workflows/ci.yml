name: Repository testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  
  go-lint:
    runs-on: self-hosted
    steps:

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Fix file permissions
      run: |
        sudo chown -R $(whoami):$(whoami) $GITHUB_WORKSPACE
        sudo chmod -R u+rwX $GITHUB_WORKSPACE
    
    - uses: actions/setup-go@v5
      with:
        go-version: '1.25'
    
    - name: Setup Go environment and dependencies
      run: |
        go mod tidy
        go mod download
        go mod verify
        go build -v .
    
    - name: Run golangci-lint
      id: golangci
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        args: --timeout=5m
      continue-on-error: true
    
    - name: Check golangci-lint result
      run: |
        OUTCOME="${{ steps.golangci.outcome }}"
        echo "golangci-lint outcome: $OUTCOME"
        if [ "$OUTCOME" = "success" ]; then
          echo "✅ No linting issues"
          exit 0
        fi
        echo "⚠️ golangci-lint failed, treating as non-critical"
        exit 0

    - name: Clean up runner VM
      if: always()
      run: |
        # Docker: stop/remove all containers, then purge images, volumes, networks and build cache
        if command -v docker >/dev/null 2>&1; then
          CONTAINERS=$(sudo docker ps -aq)
          if [ -n "$CONTAINERS" ]; then
            sudo docker rm -f $CONTAINERS || true
          fi
          sudo docker system prune -af --volumes || true
          sudo docker builder prune -af || true
        fi

        # Go build/module/test caches and golangci-lint cache
        if command -v go >/dev/null 2>&1; then
          go clean -cache -modcache -testcache || true
        fi
        sudo rm -rf "$HOME/.cache/golangci-lint" "$HOME/go/pkg/mod" || true

        # Go toolchain installed by setup-go
        sudo rm -rf "${RUNNER_TOOL_CACHE}/go" || true

        # Workspace and temp files
        sudo find "$GITHUB_WORKSPACE" -mindepth 1 -delete || true
        sudo rm -rf "${RUNNER_TEMP:?}"/* || true
