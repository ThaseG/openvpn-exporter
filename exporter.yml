# OpenVPN Exporter Configuration

# Path to OpenVPN TCP status file
ovpn_tcp_status: /home/openvpn/logs/openvpn-tcp-status

# Path to OpenVPN UDP status file
ovpn_udp_status: /home/openvpn/logs/openvpn-udp-status

# Server name to display in metrics and sessions
server_name: openvpn-server

# How often to read status files and refresh metrics (seconds, default: 15)
refresh_interval: 15

# Enable debug logging (default: false)
# When false, collection cycle log messages are suppressed
debug: true